# ============================================================
# Grafana datasource: ClickHouse
# Плагин grafana-clickhouse-datasource из GF_INSTALL_PLUGINS
# Порт 9000 (native protocol), не HTTP 8123
# ============================================================
apiVersion: 1

datasources:
  - name: ClickHouse-DPIB
    type: grafana-clickhouse-datasource
    access: proxy
    isDefault: false
    editable: true
    uid: clickhouse-dpib
    jsonData:
      protocol: native
      host: clickhouse
      port: 9000
      username: dpib
      defaultDatabase: dpib
      tlsSkipVerify: true
    secureJsonData:
      password: dpib_pass
